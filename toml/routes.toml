[[routes]]
path    = "/api/v1/health"
method  = "GET"
handler = "HealthHandler"

# ── Auth ──────────────────────────────────────────────────────────
[[routes]]
path    = "/api/v1/auth/invite/verify/{token}"
method  = "GET"
handler = "InviteVerifyHandler"

[[routes]]
path    = "/api/v1/users"
method  = "GET"
handler = "GetUsersHandler"

[[routes]]
path    = "/api/v1/users"
method  = "POST"
handler = "CreateUserHandler"

[[routes]]
path    = "/api/v1/login"
method  = "POST"
handler = "LoginHandler"
