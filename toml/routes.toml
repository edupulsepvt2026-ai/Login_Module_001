[[routes]]
path    = "/api/v1/health"
method  = "GET"
handler = "HealthHandler"

# ── Auth ──────────────────────────────────────────────────────────
[[routes]]
path    = "/api/v1/auth/invite/verify/{token}"
method  = "GET"
handler = "InviteVerifyHandler"

[[routes]]
path    = "/api/v1/users"
method  = "GET"
handler = "GetUsersHandler"

[[routes]]
path    = "/api/v1/users"
method  = "POST"
handler = "CreateUserHandler"

[[routes]]
path    = "/api/v1/login"
method  = "POST"
handler = "LoginHandler"

[[routes]]
path = "/api/v1/auth/otp/send"
method = "POST"
handler = "SendOTPHandler"

[[routes]]
path = "/api/v1/auth/email-verification/send"
method = "POST"
handler = "SendEmailVerificationHandler"

[[routes]]
path = "/api/v1/auth/otp/verify"
method = "POST"
handler = "VerifyOTPHandler"

[[routes]]
path = "/api/v1/auth/email-verification/verify"
method = "POST"
handler = "VerifyEmailHandler"

[[routes]]
path = "/api/v1/auth/chain-admin/register"
method = "POST"
handler = "RegisterChainAdminHandler"

[[routes]]
path = "/api/v1/auth/chain-admin/login"
method = "POST"
handler = "LoginChainAdminHandler"
